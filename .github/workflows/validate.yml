name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown-only guard
        run: |
          violations=$(git ls-files | grep -vE '^(\.github/workflows/[^/]+\.yml|.*\.md|.*\.json)$' || true)
          if [ -n "$violations" ]; then
            echo "Files that are neither markdown nor JSON found (hard rule: markdown-only repo):"
            echo "$violations"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest (strict)
        run: claude plugin validate --strict .

      # With marketplace.json present the validator only checks the marketplace
      # manifest, so validate the plugin itself (manifest + skills) from a copy.
      - name: Validate plugin and skills (strict)
        run: |
          cp -r . /tmp/plugin-only
          rm /tmp/plugin-only/.claude-plugin/marketplace.json
          claude plugin validate --strict /tmp/plugin-only
