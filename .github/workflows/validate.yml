name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown-only guard (one allowlisted script)
        run: |
          violations=$(git ls-files | grep -vE '^(\.gitignore|\.github/workflows/[^/]+\.yml|.*\.md|.*\.json|skills/interlink-audit/scripts/analyze\.mjs)$' || true)
          if [ -n "$violations" ]; then
            echo "Unexpected non-markdown/JSON files (hard rule: the only script allowed is skills/interlink-audit/scripts/analyze.mjs):"
            echo "$violations"
            exit 1
          fi

      - name: Analyzer script guard (stdlib-only, zero network primitives)
        run: |
          script="skills/interlink-audit/scripts/analyze.mjs"
          if grep -nE 'fetch|node:http|node:net|node:dgram|node:tls|child_process|XMLHttpRequest|WebSocket|require\(|import\(' "$script"; then
            echo "Forbidden primitive found in $script (hard rule: no network-capable or dependency-bearing scripts)."
            exit 1
          fi
          if grep -nE "from ['\"]" "$script" | grep -vE "from ['\"]node:"; then
            echo "Non-stdlib import found in $script (hard rule: node: stdlib imports only)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest (strict)
        run: claude plugin validate --strict .

      # With marketplace.json present the validator only checks the marketplace
      # manifest, so validate the plugin itself (manifest + skills) from a copy.
      - name: Validate plugin and skills (strict)
        run: |
          cp -r . /tmp/plugin-only
          rm /tmp/plugin-only/.claude-plugin/marketplace.json
          claude plugin validate --strict /tmp/plugin-only
